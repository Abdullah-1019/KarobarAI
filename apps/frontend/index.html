<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KarobarAI</title>
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <meta name="theme-color" content="#faf9f7" />

    <!-- Studio Light typography (docs/frontend/DESIGN-CONSULT.md §3). Outfit (display, drawn at 600)
         + Inter (UI) are the critical faces, each one variable file covering only the weight range
         used, with font-display: swap. Urdu faces load lazily (non-blocking): Noto Naskh Arabic for
         running UI text, Noto Nastaliq Urdu for display only. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Outfit:wght@400..700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Outfit:wght@400..700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400..700&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
