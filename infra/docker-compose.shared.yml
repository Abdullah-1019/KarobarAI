# Opt-in shared-database API mode. Use with docker-compose.yml and the root .env.
# Keep migrations as a separate, reviewed operation; normal API startup must not
# apply schema changes to a shared database.
services:
  api:
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the root .env file}
      # Separate local queues from jobs created for the Docker development database.
      REDIS_URL: redis://redis:6379/15
      MINIO_ENDPOINT: ${AWS_ENDPOINT_URL_S3}
      S3_PUBLIC_BASE_URL: ${AWS_ENDPOINT_URL_S3}
      AI_SERVICE_IMAGE_BASE_URL: ${AWS_ENDPOINT_URL_S3}
      S3_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_REGION: ${AWS_REGION}
      MINIO_BUCKET: karobarai-media
      S3_BUCKET: ""
    command: ["sh", "-c", "pnpm exec prisma generate && exec pnpm dev"]
