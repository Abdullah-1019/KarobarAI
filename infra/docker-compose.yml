name: karobarai

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: karobarai
      POSTGRES_PASSWORD: karobarai
      POSTGRES_DB: karobarai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karobarai -d karobarai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [karobarai_net]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [karobarai_net]

  # Feature 16: local inference only; no host port or Nginx route.
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5vl:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "/startup/ollama-start.sh"]
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/ollama-start.sh:/startup/ollama-start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/models-ready && ollama list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30m
    networks: [karobarai_net]

  # Dev-only S3-compatible object storage (TRD §1: "Cloudinary or local MinIO in dev").
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-karobarai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-karobarai123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [karobarai_net]

  api:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://karobarai:karobarai@postgres:5432/karobarai?schema=public
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ../apps/backend:/workspace/apps/backend
      - ../packages/shared:/workspace/packages/shared
      - shared_node_modules:/workspace/packages/shared/node_modules
      - api_node_modules:/workspace/apps/backend/node_modules
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [karobarai_net]

  ai-service:
    build:
      context: ..
      dockerfile: apps/ai-service/Dockerfile
    env_file:
      - ../.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5vl:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    volumes:
      - ../apps/ai-service:/app
    # No `ports:` mapping — never reachable from the host or Nginx (TRD §8).
    # Reachable only from `api` via the internal network at http://ai-service:8000.
    networks: [karobarai_net]

  web:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../apps/frontend:/workspace/apps/frontend
      - ../packages/shared:/workspace/packages/shared
      - shared_node_modules:/workspace/packages/shared/node_modules
      - web_node_modules:/workspace/apps/frontend/node_modules
    ports:
      - "5173:5173"
    networks: [karobarai_net]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api
      - web
    networks: [karobarai_net]

networks:
  karobarai_net:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  minio_data:
  api_node_modules:
  web_node_modules:
  shared_node_modules:
